version: "3.8"

networks:
  transporte-net:
    driver: bridge

volumes:
  transporte-es-data:

services:

  mysql:
    image: mysql:8.0
    container_name: transporte_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${HOST_MYSQL_PORT}:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - transporte-net

  postgres:
    image: postgres:15
    container_name: transporte_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${HOST_POSTGRES_PORT}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - transporte-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: transporte_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${HOST_ES_PORT}:9200"
    volumes:
      - transporte-es-data:/usr/share/elasticsearch/data
    networks:
      - transporte-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: transporte_kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${HOST_KIBANA_PORT}:5601"
    networks:
      - transporte-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: transporte_logstash
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - "${HOST_LOGSTASH_BEATS_PORT}:5044"
      - "${HOST_LOGSTASH_TCP_PORT}:5000"
    networks:
      - transporte-net

  airflow:
    build:
      context: ./airflow
    container_name: transporte_airflow
    restart: unless-stopped
    depends_on:
      - mysql
      - postgres
      - logstash
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID}
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOGSTASH_HOST: logstash
    ports:
      - "${HOST_AIRFLOW_PORT}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/scripts:/opt/airflow/scripts
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: standalone
    networks:
      - transporte-net

  generator:
    build:
      context: ./generator
    container_name: transporte_generator
    restart: unless-stopped
    depends_on:
      - logstash
    environment:
      LOGSTASH_HOST: logstash
      BUS_COUNT: ${BUS_COUNT}
      GENERATOR_INTERVAL_SECONDS: ${GENERATOR_INTERVAL_SECONDS}
      QUITO_LAT: ${QUITO_LAT}
      QUITO_LON: ${QUITO_LON}
    volumes:
      - ./generator:/app
    networks:
      - transporte-net
